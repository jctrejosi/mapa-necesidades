server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API y archivos subidos → backend (NestJS)
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # SSE (eventos en tiempo real de /api/events)
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location /uploads/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
  }

  # Chatbot Ibanaska (FastAPI) — /bot/* → bot:8000
  location /bot/ {
    proxy_pass http://bot:8000/;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  # SPA: el index.html nunca se cachea (siempre ve la versión nueva);
  # los assets con hash sí se cachean fuerte (inmutables).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri /index.html;
  }
}
