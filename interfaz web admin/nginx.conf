server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API y archivos subidos → backend (NestJS)
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # El backend usa req.ip (throttler y visitas): sin esto, todas las visitas
    # compartirían la IP del contenedor nginx y los límites por IP se romperían.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location /uploads/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA (una sola página)
  location / {
    try_files $uri /index.html;
  }
}
