# SolidaridadCO — despliegue local de la aplicación.
# La base de datos vive en Supabase (nube); aquí solo corren backend y frontends.
#
#   docker compose up -d --build
#
# Nombre de proyecto único: evita colisionar con otros compose del equipo que
# también se ejecutan desde una carpeta llamada "db" (mercaldas-ecommerce, tesis).
name: redsolidaria
services:
  backend:
    build: ../backend
    container_name: redsolidaria-backend
    restart: unless-stopped
    environment:
      # PostgreSQL alojado en Supabase (el password va URL-encoded: @ → %40)
      DATABASE_URL: postgresql://postgres.idiypzqlbjeqgphjlabz:Ju%40n5826227567@aws-0-us-west-2.pooler.supabase.com:6543/redsolidaria_db?pgbouncer=true
      DB_SSL: "true"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PORT: "3000"
      UPLOAD_DIR: /app/uploads
      FRONTEND_ORIGIN: http://localhost:8080,http://localhost:8081
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
      # Dump legado (MySQL) accesible para la migración de datos:
      - ../backups:/app/legacy-backups:ro

  frontend:
    build: "../interfaz web"
    container_name: redsolidaria-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  frontend-admin:
    build: "../interfaz web admin"
    container_name: redsolidaria-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  uploads_data:
