<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noticias y Comunicados</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="ciudades.js"></script>
<style>
  :root {
    --amarillo: #FCD116; --azul: #003893; --rojo: #CE1126;
    --naranja: #E08E00; --verde: #2E9E5B; --gris: #9AA0AC;
    --bg: #f4f5f7; --texto: #1f2430; --borde: #e1e4e9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--texto);
  }
  header {
    background: linear-gradient(90deg, var(--amarillo) 0 34%, var(--azul) 34% 67%, var(--rojo) 67% 100%);
    padding: 3px 0 0 0;
  }
  .header-inner {
    background: #fff;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    border-bottom: 1px solid var(--borde);
  }
  .header-inner h1 { font-size: 1.05rem; margin: 0; }
  .btn {
    border: none; border-radius: 8px; padding: 9px 14px; font-size: 0.85rem;
    font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block;
  }
  .btn-outline { background: #fff; color: var(--azul); border: 1.5px solid var(--azul); }
  .selector-ciudad {
    padding: 9px 12px; border: 1.5px solid var(--azul); border-radius: 8px;
    font-size: 0.85rem; font-weight: 600; color: var(--azul); background: #fff; cursor: pointer;
  }

  main { max-width: 720px; margin: 0 auto; padding: 16px; }

  .noticia {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .noticia img {
    width: 100%;
    max-height: 320px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 12px;
  }
  .noticia h2 { margin: 0 0 6px 0; font-size: 1.15rem; }
  .noticia .meta { font-size: 0.78rem; color: #888; margin-bottom: 12px; }
  .noticia .cuerpo { font-size: 0.92rem; line-height: 1.6; white-space: pre-line; }
  .tag-ciudad {
    display: inline-block; font-size: 0.68rem; font-weight: 700; padding: 2px 8px;
    border-radius: 999px; background: var(--amarillo); color: var(--texto);
    text-transform: uppercase; letter-spacing: .03em; margin-bottom: 8px;
  }

  .empty { text-align: center; color: #999; padding: 40px 10px; font-size: 0.9rem; }
  footer { text-align: center; font-size: 0.68rem; color: #999; padding: 16px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>📰 Noticias y Comunicados</h1>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <select id="selectorCiudad" class="selector-ciudad"></select>
      <a href="index.html" class="btn btn-outline">🗺️ Ver mapa</a>
      <a href="vivienda.html" class="btn btn-outline">🏠 Vivienda</a>
      <a href="danos.html" class="btn btn-outline">🏚️ Reporte de daños (Manizales)</a>
    </div>
  </div>
</header>

<main id="listaNoticias">
  <p style="text-align:center;color:#888;">Cargando...</p>
</main>

<footer>🌎 Plataforma solidaria y apolítica · 📍 Terremoto Colombia 10/08/2026 · App hecha con ❤️ por un Manizaleño solidario · ✉️ wilmarecheverry@gmail.com · 💬 WhatsApp +57 310 381 7213</footer>

<script>
const API = 'api.php';
let ciudadActual = obtenerCiudadActual();

async function cargarNoticias() {
  const res = await fetch(`${API}?action=listar_noticias&ciudad=${ciudadActual}`);
  const data = await res.json();
  render(data.noticias || []);
}

function render(noticias) {
  const cont = document.getElementById('listaNoticias');
  if (noticias.length === 0) {
    cont.innerHTML = '<div class="empty">No hay comunicados publicados todavía.</div>';
    return;
  }

  cont.innerHTML = noticias.map(n => `
    <article class="noticia">
      ${!n.ciudad ? '<span class="tag-ciudad">📢 Todas las ciudades</span><br>' : ''}
      ${n.imagen ? `<img src="uploads/${n.imagen}" alt="${escapeHtml(n.titulo)}">` : ''}
      <h2>${escapeHtml(n.titulo)}</h2>
      <div class="meta">${formatearFecha(n.fecha)}${n.autor ? ' · ' + escapeHtml(n.autor) : ''}</div>
      <div class="cuerpo">${escapeHtml(n.contenido)}</div>
    </article>
  `).join('');
}

function formatearFecha(fechaStr) {
  if (!fechaStr) return '';
  const [y, m, d] = fechaStr.split('-');
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return `${parseInt(d)} de ${meses[parseInt(m) - 1]} de ${y}`;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function cambiarCiudad(nuevaCiudad) {
  ciudadActual = nuevaCiudad;
  cargarNoticias();
}
inicializarSelectorCiudad('selectorCiudad', cambiarCiudad);

cargarNoticias();
setInterval(cargarNoticias, 60000);
</script>
</body>
</html>
