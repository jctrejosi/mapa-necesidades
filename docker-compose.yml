services:
  db:
    image: mysql:8.4
    container_name: mapa-necesidades-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_local
      MYSQL_DATABASE: mapa_necesidades
      MYSQL_USER: mapa_user
      MYSQL_PASSWORD: mapa_pass_local
    ports:
      # Expuesto en 3307 para no chocar con un MySQL local del host
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Se ejecuta solo la primera vez que se crea el volumen:
      # schema.sql + migraciones 8-11 (las demás ya están incluidas en schema.sql)
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_local"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: mapa-necesidades-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: mapa_necesidades
      DB_USER: mapa_user
      DB_PASS: mapa_pass_local
      ADMIN_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
