# Prueba local del stack único (backend + bot + ia). Usa el Postgres local de dev.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Postgres local de desarrollo (node setup.js lo levanta en :5435)
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5435/redsolidaria
      DB_SSL: "false"
      ADMIN_PASSWORD: admin123
      ADMIN_EDIT: admin-edit-2026
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      FRONTEND_ORIGIN: http://localhost:8080,http://localhost:8081
      DEEPSEEK_API_KEY_BOT: ${DEEPSEEK_API_KEY_BOT:-}
      DEEPSEEK_API_KEY_IA_SERVICE: ${DEEPSEEK_API_KEY_IA_SERVICE:-}
      DEEPSEEK_MODEL: deepseek-chat
